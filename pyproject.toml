[tool.poetry]
name = "marketplace-sales-pipeline"
version = "0.1.0"
description = "Data pipeline and analytics for marketplace sales"
authors = ["volodin-nn"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32"
psycopg2-binary = "^2.9"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6"
black = "^24.0"
pytest = "^8.0"
requests-mock = "^1.12"
freezegun = "^1.5"

[tool.poetry.group.analysis.dependencies]
pandas = "^2.2"
sqlalchemy = "^2.0"
jupyter = "^1.0"
pygwalker = "^0.4"
matplotlib = "^3.9"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
